name: Production migration drift

# Fails (and GitHub emails the owner) when production's applied migrations differ from supabase/migrations on main:
# a merged migration nobody applied, or a production change the repository does not record. Runs right after every
# release merge, nightly, and on demand. Read-only against production.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-migration-drift
  cancel-in-progress: true

jobs:
  drift:
    # Same boundary as the backup workflow: production credentials only ever meet code from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Compare production migrations with the repository
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: scripts/backup/check-migrations.sh
