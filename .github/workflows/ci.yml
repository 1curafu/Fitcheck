name: CI

# Runs on every PR into main and on pushes to main. The `main` ruleset requires
# this to pass before a PR can merge. Deliberately does NOT run `npm run lint`:
# main currently has 5 pre-existing eslint errors, so a lint gate would block
# every merge until those are cleaned up (their own task). Add lint here once
# `npm run lint` is green on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # @v5 of both actions runs on Node 24. The @v4 releases still ship a Node
      # 20 entrypoint, which GitHub deprecated in September 2025 and now forces
      # onto 24 with a warning on every run — pinning the newer majors removes
      # the warning rather than silencing it.
      # NOTE: `node-version` below is the runtime for OUR build steps and is
      # unrelated to the action runtime the warning was about.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # End-to-end, in a real browser, against a real database. Separate from
  # `verify` because it is slower and needs the Supabase stack; both are
  # required checks on the `main` ruleset — an e2e job that cannot block a
  # merge is decorative.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WebKit, not Chromium. iOS Safari is the actual target, and this project
      # has already shipped a layout bug Chrome tolerated and Safari did not
      # (the grid <img> min-height issue, docs/STATE.md).
      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ⚠️ config.toml reads the Google OAuth pair via env(); `supabase start`
      # fails outright without them. Dummy values are fine — nothing in the
      # suite signs in with Google.
      - name: Start Supabase
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-not-used
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-not-used
        run: supabase start

      - name: Export Supabase credentials
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL' | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY' | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY' | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV

      # No ANTHROPIC_API_KEY: the re-rank is stubbed (FITCHECK_STUB_AI, set by
      # playwright.config.ts), so CI spends nothing and the look names are
      # stable enough to assert.
      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
