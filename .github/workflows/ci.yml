name: CI

# Runs on every PR into main and on pushes to main. The `main` ruleset requires
# this to pass before a PR can merge. Deliberately does NOT run `npm run lint`:
# main currently has 5 pre-existing eslint errors, so a lint gate would block
# every merge until those are cleaned up (their own task). Add lint here once
# `npm run lint` is green on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # @v5 of both actions runs on Node 24. The @v4 releases still ship a Node
      # 20 entrypoint, which GitHub deprecated in September 2025 and now forces
      # onto 24 with a warning on every run — pinning the newer majors removes
      # the warning rather than silencing it.
      # NOTE: `node-version` below is the runtime for OUR build steps and is
      # unrelated to the action runtime the warning was about.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
